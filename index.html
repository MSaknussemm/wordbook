<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生词本</title>
<style>
  :root{
    --paper:#f6f3ec;
    --ink:#1f242b;
    --muted:#6d7480;
    --line:#e3ddd1;
    --card:#fffdf8;
    --accent:#0f766e;
    --accent-soft:#e4f1ef;
    --accent-ink:#ffffff;      /* 主按钮上的字色 */
    --danger:#b3261e;
    --shadow:0 1px 2px rgba(31,36,43,.05), 0 10px 24px -22px rgba(31,36,43,.45);
  }
  *{box-sizing:border-box}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    font-size:15px;
    line-height:1.7;
  }
  .app{
    display:grid;
    grid-template-columns:330px minmax(0,1fr);
    height:100vh;
    max-width:1280px;
    margin:0 auto;
  }

  .left{
    border-right:1px solid var(--line);
    padding:28px 24px;
    display:flex;
    flex-direction:column;
    gap:16px;
    overflow:auto;
  }
  .brand{font-size:19px;margin:0;letter-spacing:.06em;font-weight:650}
  .sub{color:var(--muted);font-size:12.5px;margin:4px 0 0}
  form{display:flex;gap:8px}
  input[type=text]{
    flex:1;min-width:0;padding:12px 14px;font-size:17px;
    font-family:Georgia,"Times New Roman",serif;
    color:var(--ink);
    border:1px solid var(--line);border-radius:10px;background:var(--card);outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid transparent;transition:.15s}
  #go{padding:12px 16px;background:var(--accent);color:var(--accent-ink);font-size:14px;letter-spacing:.06em}
  #go:hover{background:#0b5f59}
  .hint{margin:0;color:var(--muted);font-size:12.5px}
  .recent{margin-top:2px}
  .recent h2{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
  .recent ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
  .recent li{
    font-family:Georgia,serif;font-size:13px;padding:4px 10px;
    border:1px solid var(--line);border-radius:999px;background:var(--card);
    cursor:pointer;color:#3a424c;
  }
  .recent li:hover{border-color:var(--accent);color:var(--accent)}
  .recent li.saved{background:var(--accent-soft);border-color:#bfded9}

  .right{padding:36px 40px;overflow:auto;display:flex}
  .empty{margin:auto;color:#a7a29a;font-size:14px;letter-spacing:.05em}
  .card{
    width:min(100%,620px);
    margin:8vh auto 0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:34px 36px 26px;
    box-shadow:var(--shadow);
    align-self:flex-start;
  }
  .word{
    font-family:Georgia,"Times New Roman",serif;
    font-size:40px;
    line-height:1.15;
    font-weight:600;
    margin:0 0 12px;
    letter-spacing:.01em;
  }
  .line{margin:0;font-size:17px;line-height:1.75;color:#2b313a}
  .line .pos{font-family:Georgia,serif;font-style:italic;color:#8a5a2b;margin-right:6px}
  .entry-row{display:flex;gap:10px;margin-bottom:6px}
  .entry-row:last-child{margin-bottom:0}
  .entry-row .pos{flex:0 0 auto;min-width:36px;margin-right:0;padding-top:1px}
  .entry-row .def{flex:1;min-width:0;max-width:62ch}
  .footer{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
  }
  #save{padding:10px 22px;background:var(--accent);color:var(--accent-ink);font-size:14px;letter-spacing:.06em}
  #save:hover:not(:disabled){background:#0b5f59}
  #save:disabled{opacity:.55;cursor:not-allowed}
  #save.done{background:var(--accent-soft);color:var(--accent);opacity:1}
  .note{font-size:12.5px;color:var(--muted)}

  .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .mini{
    padding:6px 10px;background:transparent;border:1px solid var(--line);
    color:var(--muted);font-size:12px;letter-spacing:.04em;
  }
  .mini:hover{border-color:var(--accent);color:var(--accent)}
  .ghost{
    padding:9px 14px;background:transparent;border:1px solid var(--line);
    color:var(--muted);font-size:13px;
  }
  .ghost:hover{border-color:var(--danger);color:var(--danger)}
  .quit{
    margin-top:14px;padding:8px 12px;background:transparent;
    border:1px solid var(--line);color:var(--muted);
    font-size:12.5px;letter-spacing:.06em;
  }
  .quit:hover{border-color:var(--danger);color:var(--danger)}

  .sheet{
    position:fixed;inset:0;background:rgba(20,24,30,.45);
    display:flex;align-items:center;justify-content:center;z-index:20;padding:24px;
  }
  .sheet[hidden]{display:none}
  .sheet-box{
    width:min(560px,100%);max-height:86vh;overflow:auto;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:26px 28px 20px;box-shadow:var(--shadow);
  }
  .sheet-box h2{margin:0 0 4px;font-size:18px;letter-spacing:.04em}
  .sheet-hint{margin:0 0 16px;color:var(--muted);font-size:12.5px}
  .presets{display:flex;gap:8px;margin-bottom:16px}
  .presets button{
    padding:6px 14px;border:1px solid var(--line);background:transparent;
    color:#4a5058;font-size:13px;border-radius:999px;
  }
  .presets button:hover{border-color:var(--accent);color:var(--accent)}
  .fields{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
    gap:8px 12px;margin-bottom:18px;
  }
  .fields label{display:flex;align-items:center;gap:7px;font-size:13.5px;color:#3a424c}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .row span{font-size:13.5px;color:#3a424c}
  .row select{
    font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;
    border:1px solid var(--line);background:var(--paper);color:var(--ink);outline:none;
  }
  .tpl{display:block;font-size:12.5px;color:var(--muted);line-height:1.7}
  .tpl textarea{
    width:100%;margin-top:6px;padding:10px 12px;font-family:Consolas,"Courier New",monospace;
    font-size:12.5px;line-height:1.6;color:var(--ink);background:var(--paper);
    border:1px solid var(--line);border-radius:8px;resize:vertical;outline:none;
  }
  .tpl textarea:focus{border-color:var(--accent)}
  .sheet-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .sheet-foot .primary{padding:9px 20px;background:var(--accent);color:var(--accent-ink);font-size:13.5px}
  .sheet-foot button{padding:9px 16px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13.5px}

  .preview{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
  .preview .cap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);letter-spacing:.06em}
  .preview .badge{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .preview pre{
    margin:8px 0 0;padding:10px 12px;background:var(--paper);border:1px solid var(--line);
    border-radius:8px;font-family:Consolas,"Courier New",monospace;font-size:12.5px;
    line-height:1.6;white-space:pre-wrap;word-break:break-word;
    max-height:170px;overflow:auto;color:var(--ink);
  }
  .preview .empty{font-size:12.5px;color:var(--muted);margin:8px 0 0}

  .error{border-left:3px solid var(--danger);background:#fdf1f0;padding:16px 20px;border-radius:8px;color:#7a1c17;font-size:14px}
  .error b{display:block;margin-bottom:4px}
  .loading{color:var(--muted);font-size:14px;letter-spacing:.08em}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    background:#20242a;color:#fff;font-size:13.5px;padding:10px 18px;border-radius:999px;
    opacity:0;transition:opacity .18s, transform .18s;pointer-events:none;z-index:30;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  .bye{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;
    background:var(--paper);color:var(--muted);
    font-size:14px;line-height:1.9;text-align:center;
  }
  .bye-h{font-size:20px;color:var(--ink);letter-spacing:.08em}

  @media (prefers-color-scheme: dark){
    :root{
      --paper:#14171c; --ink:#e9e6df; --muted:#98a1ab; --line:#2a3038;
      --card:#1b1f26; --accent:#45b8a9; --accent-soft:#12312e; --danger:#ff6f63;
      --accent-ink:#06201d;   /* 深色下亮绿底配白字只有 2.4:1，改深字 */
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -20px rgba(0,0,0,.8);
    }
    .word{color:#f3f0ea}
    .line{color:#d7d3cb}
    .presets button{color:#c9c4bb}
    .recent li{color:#c9c4bb}
    .fields label,.row span{color:#cfcac2}
    .sheet{background:rgba(0,0,0,.6)}
    .line .pos{color:#d9a05b}
    .error{background:#2a1512;color:#ffb4ad;border-left-color:#ff6f63}
  }

  @media (max-width:820px){
    .app{grid-template-columns:1fr;height:auto}
    .left{border-right:0;border-bottom:1px solid var(--line)}
    .right{padding:24px 20px 80px}
    .card{padding:24px 22px;margin-top:12px}
    .word{font-size:32px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="left">
    <div>
      <h1 class="brand" data-i18n="title">生词本</h1>
      <p class="sub" data-i18n="sub">输入 · 回车 · 记下</p>
    </div>

    <form id="form" autocomplete="off">
      <input id="q" type="text" placeholder="serendipity" spellcheck="false" autofocus>
      <button id="go" type="submit" data-i18n="lookup">查询</button>
    </form>

    <p class="hint" data-i18n="hint">只显示单词和「词性 + 意思」；要留档就点右侧「记下」。</p>
    <p class="hint" id="notesFallback" role="status" hidden></p>

    <div class="recent">
      <h2 data-i18n="recent">最近查过</h2>
      <ul id="recent"></ul>
    </div>

    <div class="actions">
      <button id="openNotes" class="mini" type="button" data-i18n="openNotes">打开词表</button>
      <button id="exportAnki" class="mini" type="button" data-i18n="exportAnki">导出 Anki</button>
      <button id="settings" class="mini" type="button" data-i18n="settings">⚙ 记录设置</button>
    </div>

    <button id="quit" class="quit" type="button" data-i18n="quit">退出程序</button>
  </aside>

  <main class="right" id="right">
    <div class="empty" id="empty" data-i18n="empty">左侧敲一个英文单词，右边出词性和意思。</div>
    <article class="card" id="card" hidden></article>
  </main>
</div>

<div class="toast" id="toast"></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-box">
    <h2 data-i18n="settingsTitle">记录设置</h2>
    <p class="sheet-hint" data-i18n="settingsHint">只影响以后「记下」的词条，已经记好的不会改动。</p>

    <label class="row">
      <span data-i18n="langLabel">界面语言</span>
      <select id="lang">
        <option value="auto" data-i18n="langAuto">跟随系统</option>
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </label>

    <label class="tpl">
      <span data-i18n="notesPathLabel">已有词表路径（留空使用桌面的词表）</span>
      <input id="notesPath" type="text" spellcheck="false" style="width:100%">
    </label>

    <div class="presets">
      <button data-preset="min" type="button" data-i18n="presetMin">极简</button>
      <button data-preset="card" type="button" data-i18n="presetCard">学习卡</button>
      <button data-preset="full" type="button" data-i18n="presetFull">全量</button>
    </div>

    <div class="fields" id="fields"></div>

    <label class="tpl">
      <span data-i18n="templateLabel">自定义模板（留空就用上面的开关；填了就以模板为准）</span>
      <textarea id="template" rows="4" placeholder="{{word}}&#10;{{pos}} {{zh}}"></textarea>
    </label>

    <div class="preview">
      <div class="cap"><span data-i18n="previewLabel">写进词表的样子</span><span class="badge" id="presetBadge">极简</span></div>
      <pre id="preview" hidden></pre>
      <p class="empty" id="previewEmpty" data-i18n="previewEmpty">先查一个词，这里就能看到它会怎么写进去。</p>
    </div>

    <div class="sheet-foot">
      <button id="cancelCfg" type="button" data-i18n="cancel">取消</button>
      <button id="saveCfg" class="primary" type="button" data-i18n="saveCfg">保存</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- 文案 ----------
  const I18N = {
    zh: {
      title: "生词本", sub: "输入 · 回车 · 记下",
      lookup: "查询", hint: "只显示单词和「词性 + 意思」；要留档就点右侧「记下」。",
      recent: "最近查过", recentEmpty: "还没有记录",
      openNotes: "打开词表", exportAnki: "导出 Anki", settings: "⚙ 记录设置", quit: "退出程序",
      empty: "左侧敲一个英文单词，右边出词性和意思。",
      save: "记下", saved: "已在词表里", saving: "写入中…", savedOk: "✓ 已记下",
      note: "写入 词表.txt，两行一条", undo: "撤销上一条",
      loading: "正在查「{0}」…", cancel: "取消",
      errTitle: "没查到「{0}」", errTimeout: "查询超时或被取消（上限 30 秒）",
      errOffline: "本地服务没响应：{0}",
      settingsTitle: "记录设置",
      notesPathLabel: "已有词表路径（留空使用桌面的词表）",
      notesPathFallback: "找不到原来的自定义词表。当前使用默认词表：{0}。可在「记录设置」中重新选择。",
      settingsHint: "只影响以后「记下」的词条，已经记好的不会改动。「中文释义」和「英文原义」都关掉的话，词条只剩单词一行。",
      langLabel: "界面语言", langAuto: "跟随系统",
      presetMin: "极简", presetCard: "学习卡", presetFull: "全量",
      templateLabel: "自定义模板（留空就用上面的开关；填了就以模板为准）",
      saveCfg: "保存",
      previewLabel: "写进词表的样子",
      previewEmpty: "先查一个词，这里就能看到它会怎么写进去。",
      previewFail: "预览失败：{0}",
      presetCustom: "自定义",
      cfgSaved: "设置已保存，从下一条开始生效", cfgFailed: "保存失败：{0}",
      already: "这个词已经在词表里了", dupToast: "之前就记过了，没重复写",
      wrote: "已写入 {0}（共 {1} 条）",
      savedToast: "已记下 · 共 {0} 条",
      undoDone: "已撤销「{0}」", undoFailed: "撤销失败：{0}",
      openFailed: "打不开：{0}",
      fields: { pos: "词性", zh: "中文释义", en: "英文原义", phonetic: "音标",
                examples: "例句", forms: "变形", exam: "考试标签", web: "网络释义", time: "记录时间" },
      byeTitle: "已退出", byeBody: "服务已关闭，直接关掉这个标签页就行。<br>下次双击桌面上的「生词本」图标重新打开。"
    },
    en: {
      title: "Wordbook", sub: "Type · Enter · Keep",
      lookup: "Look up", hint: "Only the word and its part of speech — click Keep to save it.",
      recent: "Recent", recentEmpty: "Nothing yet",
      openNotes: "Open notes", exportAnki: "Export Anki", settings: "⚙ Settings", quit: "Quit",
      empty: "Type a word on the left; the meaning shows up here.",
      save: "Keep", saved: "Already saved", saving: "Saving…", savedOk: "✓ Saved",
      note: "Written to 词表.txt", undo: "Undo",
      loading: "Looking up “{0}”…", cancel: "Cancel",
      errTitle: "Not found: “{0}”", errTimeout: "Timed out or cancelled (30 s limit)",
      errOffline: "Local service did not respond: {0}",
      settingsTitle: "Entry settings",
      notesPathLabel: "Path to an existing word list (blank uses your desktop)",
      notesPathFallback: "Your custom word list could not be found. Using the default at {0}. Choose a file in Settings to switch back.",
      settingsHint: "Only affects entries you save from now on. Turning off both Chinese and English leaves just the word.",
      langLabel: "Interface language", langAuto: "Follow system",
      presetMin: "Minimal", presetCard: "Study card", presetFull: "Everything",
      templateLabel: "Custom template (leave empty to use the checkboxes above)",
      saveCfg: "Save",
      previewLabel: "What gets written",
      previewEmpty: "Look up a word first and its entry will show up here.",
      previewFail: "Preview failed: {0}",
      presetCustom: "Custom",
      cfgSaved: "Settings saved; applies to the next entry", cfgFailed: "Could not save: {0}",
      already: "This word is already saved", dupToast: "Already saved earlier — nothing written",
      wrote: "Wrote to {0} ({1} entries)",
      savedToast: "Saved · {0} entries",
      undoDone: "Undone: “{0}”", undoFailed: "Undo failed: {0}",
      openFailed: "Could not open: {0}",
      fields: { pos: "Part of speech", zh: "Chinese", en: "English", phonetic: "Phonetic",
                examples: "Examples", forms: "Forms", exam: "Exam tags", web: "Web", time: "Timestamp" },
      byeTitle: "Stopped", byeBody: "The service is closed — just close this tab.<br>Double-click the Wordbook icon to start again."
    }
  };

  let LANG = "zh";

  function t(key, ...args) {
    let s = (I18N[LANG] && I18N[LANG][key]);
    if (s === undefined) s = I18N.zh[key];
    if (s === undefined) return key;
    if (typeof s !== "string") return s;      // fields 这类字典对象原样返回
    return s.replace(/\{(\d+)\}/g, (m, i) => (args[i] !== undefined ? args[i] : m));
  }

  function applyI18n() {
    document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach((node) => {
      const key = node.dataset.i18n;
      if (key === "langAuto") { node.textContent = t("langAuto"); return; }
      node.textContent = t(key);
    });
    const fallback = $("notesFallback");
    fallback.hidden = !fallbackNotesPath;
    fallback.textContent = fallbackNotesPath ? t("notesPathFallback", fallbackNotesPath) : "";
    renderFields();
    if (current) render(current);
    else if (!card.hidden) { /* 错误/加载态：保持原样 */ }
    renderRecent();
  }

  const $ = (id) => document.getElementById(id);
  const input = $("q");
  const form = $("form");
  const card = $("card");
  const empty = $("empty");
  const toastEl = $("toast");
  const recentEl = $("recent");

  const RECENT_KEY = "wordbook.recent.v1";
  const SAVED_KEY = "wordbook.saved.v1";

  let current = null;
  let busy = false;
  let canUndo = false;
  let toastTimer = null;
  let inflight = null;
  let lookupSeq = 0;
  let cfg = { fields: { pos: true, zh: true }, template: "", lang: "auto" };
  let fallbackNotesPath = "";
  let notesPathEdited = false;

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2600);
  }

  function loadStored(key) {
    try { return JSON.parse(localStorage.getItem(key) || "[]"); }
    catch (e) { return []; }
  }

  function store(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  function api(path) {
    return path + (path.includes("?") ? "&" : "?") + "lang=" + LANG;
  }

  function pushRecent(word) {
    const list = loadStored(RECENT_KEY).filter((w) => w !== word);
    list.unshift(word);
    store(RECENT_KEY, list.slice(0, 14));
    renderRecent();
  }

  function renderRecent() {
    const words = loadStored(RECENT_KEY);
    const saved = new Set(loadStored(SAVED_KEY));
    recentEl.textContent = "";
    if (!words.length) {
      const li = el("li", null, t("recentEmpty"));
      li.style.cursor = "default";
      li.style.opacity = ".6";
      recentEl.appendChild(li);
      return;
    }
    words.forEach((w) => {
      const li = el("li", saved.has(wkey(w)) ? "saved" : null, w);
      li.title = w;
      li.addEventListener("click", () => {
        input.value = w;
        doLookup(w);
      });
      recentEl.appendChild(li);
    });
  }

  function buildParts(data) {
    const entries = (data.entries || []).filter((e) => e && (e.zh || e.en));
    const withZh = entries.filter((e) => e.zh);
    const list = withZh.length ? withZh : entries;

    const groups = new Map();
    list.forEach((e) => {
      const pos = e.pos || "";
      const text = (e.zh || e.en || "").trim();
      if (!text) return;
      if (!groups.has(pos)) groups.set(pos, []);
      const arr = groups.get(pos);
      if (arr.indexOf(text) < 0) arr.push(text);
    });

    const out = [];
    groups.forEach((texts, pos) => out.push({ pos, text: texts.join(LANG === "zh" ? "；" : "; ") }));
    return out;
  }

  function render(data) {
    card.textContent = "";
    card.hidden = false;
    empty.hidden = true;

    card.appendChild(el("h2", "word", data.word));

    const line = el("div", "line");
    const parts = buildParts(data);
    if (!parts.length) {
      line.textContent = LANG === "zh" ? "（这个词典没给释义）" : "(no definition from the dictionary)";
      line.style.color = "#8b8b8b";
    } else {
      parts.forEach((p) => {
        const row = el("div", "entry-row");
        row.appendChild(el("span", "pos", p.pos || ""));
        row.appendChild(el("span", "def", p.text));
        line.appendChild(row);
      });
    }
    card.appendChild(line);

    const foot = el("div", "footer");
    const btn = el("button", null, data.saved ? t("saved") : t("save"));
    btn.id = "save";
    btn.type = "button";
    if (data.saved) {
      btn.disabled = true;
    } else {
      btn.addEventListener("click", () => saveWord(btn));
    }
    foot.appendChild(btn);

    const undoBtn = el("button", "ghost", t("undo"));
    undoBtn.id = "undoBtn";
    undoBtn.type = "button";
    undoBtn.hidden = !canUndo;
    undoBtn.addEventListener("click", () => doUndo(undoBtn));
    foot.appendChild(undoBtn);

    foot.appendChild(el("span", "note", t("note")));
    card.appendChild(foot);
  }

  function renderError(message, word) {
    card.hidden = false;
    empty.hidden = true;
    card.textContent = "";
    const box = el("div", "error");
    box.appendChild(el("b", null, t("errTitle", word || "")));
    box.appendChild(el("div", null, message));
    card.appendChild(box);
  }

  function renderLoading(word, controller) {
    card.hidden = false;
    empty.hidden = true;
    card.textContent = "";
    const box = el("div", "loading");
    box.appendChild(document.createTextNode(t("loading", word) + " "));
    const cancel = el("button", "mini", t("cancel"));
    cancel.type = "button";
    cancel.style.marginLeft = "8px";
    cancel.addEventListener("click", () => {
      try { controller.abort(); } catch (e) {}
    });
    box.appendChild(cancel);
    card.appendChild(box);
  }

  async function doLookup(rawWord) {
    const word = (rawWord || "").trim();
    if (!word) return;
    if (inflight) { try { inflight.abort(); } catch (e) {} }

    const controller = new AbortController();
    inflight = controller;
    const seq = ++lookupSeq;      // 只有最新一次查询能改卡片
    busy = true;
    renderLoading(word, controller);
    const timer = setTimeout(() => { try { controller.abort(); } catch (e) {} }, 30000);

    try {
      const resp = await fetch(api("/api/lookup?word=" + encodeURIComponent(word)), {
        signal: controller.signal
      });
      const data = await resp.json();
      if (seq !== lookupSeq) return;   // 被更新的查询取代，静默退出
      if (!data.ok) {
        renderError(data.error || "?", word);
        return;
      }
      current = data;
      render(data);
      pushRecent(data.word);
      if (data.saved) toast(t("already"));
    } catch (err) {
      if (seq !== lookupSeq) return;   // 旧请求被取消，别盖掉新界面
      if (err.name === "AbortError") renderError(t("errTimeout"), word);
      else renderError(t("errOffline", err.message), word);
    } finally {
      clearTimeout(timer);
      if (inflight === controller) inflight = null;
      busy = false;
    }
  }

  async function saveWord(btn) {
    if (!current) return;
    // 绑定「点下去的那一刻」的词。请求期间用户可能已经查了别的词，
    // 响应回来时必须只更新这个词，绝不能改 current（那可能是另一个词）
    const target = current.word;
    btn.disabled = true;
    btn.textContent = t("saving");
    try {
      const resp = await fetch(api("/api/save"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ word: target })
      });
      const data = await resp.json();
      if (!data.ok) {
        btn.disabled = false;
        btn.textContent = t("save");
        toast(data.error || "?");
        return;
      }
      const stillHere = current && wkey(current.word) === wkey(target);
      if (data.duplicate) {
        if (stillHere) { btn.textContent = t("saved"); current.saved = true; }
        toast(t("dupToast"));
      } else {
        if (stillHere) {
          btn.textContent = t("savedOk");
          btn.classList.add("done");
          current.saved = true;
        }
        toast(t("savedToast", data.count));
        canUndo = true;
        const ub = $("undoBtn");
        if (ub) ub.hidden = false;
      }
      const saved = new Set(loadStored(SAVED_KEY));
      saved.add(wkey(target));              // 记的是真正写进文件的那个词
      store(SAVED_KEY, [...saved]);
      renderRecent();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = t("save");
      toast(t("errOffline", err.message));
    }
  }

  async function doUndo(btn) {
    btn.disabled = true;
    try {
      const resp = await fetch(api("/api/undo"), { method: "POST" });
      const data = await resp.json();
      if (!data.ok) {
        toast(data.error || t("undoFailed", ""));
        return;
      }
      canUndo = false;
      btn.hidden = true;
      toast(t("undoDone", data.word));
      // 撤销后「最近查过」里的已保存标记也要一起清掉，否则刷新后还在骗人
      const saved = new Set(loadStored(SAVED_KEY));
      if (saved.delete(wkey(data.word))) store(SAVED_KEY, [...saved]);
      if (current && wkey(current.word) === wkey(data.word)) {
        current.saved = false;
        render(current);
      }
      renderRecent();
    } catch (err) {
      toast(t("undoFailed", err.message));
    } finally {
      btn.disabled = false;
    }
  }

  // ---------- 设置 ----------
  const FIELD_KEYS = ["pos", "zh", "en", "phonetic", "examples", "forms", "exam", "web", "time"];
  const PRESETS = {
    min: { pos: true, zh: true },
    card: { pos: true, zh: true, phonetic: true, examples: true },
    full: { pos: true, zh: true, en: true, phonetic: true, examples: true,
            forms: true, exam: true, web: true, time: true }
  };

  async function loadCfg() {
    try {
      const resp = await fetch(api("/api/config"));
      const data = await resp.json();
      if (data.ok) {
        if (data.config) cfg = data.config;
        fallbackNotesPath = data.notes_path_fallback ? data.path : "";
        $("notesPath").disabled = !!data.notes_path_locked;
        $("notesPath").placeholder = data.path || "";
        if (typeof data.undo_available === "boolean") canUndo = data.undo_available;
      }
    } catch (e) {}
  }

  function renderFields() {
    const box = $("fields");
    if (!box) return;
    box.textContent = "";
    FIELD_KEYS.forEach((key) => {
      const lab = el("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.dataset.key = key;
      cb.checked = !!(cfg.fields && cfg.fields[key]);
      cb.addEventListener("change", schedulePreview);
      lab.appendChild(cb);
      lab.appendChild(document.createTextNode(t("fields")[key] || key));
      box.appendChild(lab);
    });
  }

  function readFields() {
    const out = {};
    $("fields").querySelectorAll("input[type=checkbox]").forEach((cb) => {
      out[cb.dataset.key] = cb.checked;
    });
    return out;
  }

  function applyPreset(name) {
    const preset = PRESETS[name] || {};
    $("fields").querySelectorAll("input[type=checkbox]").forEach((cb) => {
      cb.checked = Object.prototype.hasOwnProperty.call(preset, cb.dataset.key)
        ? !!preset[cb.dataset.key]
        : false;
    });
  }

  function effectiveLang() {
    if (cfg.lang === "zh" || cfg.lang === "en") return cfg.lang;
    const nav = (navigator.language || "zh").toLowerCase();
    return nav.indexOf("zh") === 0 ? "zh" : "en";
  }

  let lastFocus = null;

  function openSheet() {
    lastFocus = document.activeElement;
    $("sheet").hidden = false;
    const first = $("lang");
    if (first) first.focus();
    schedulePreview();
  }

  function closeSheet() {
    $("sheet").hidden = true;
    if (lastFocus && typeof lastFocus.focus === "function") lastFocus.focus();
  }

  $("settings").addEventListener("click", async () => {
    await loadCfg();
    $("lang").value = cfg.lang || "auto";
    $("notesPath").value = cfg.notes_path || "";
    notesPathEdited = false;
    renderFields();
    $("template").value = cfg.template || "";
    openSheet();
  });

  $("cancelCfg").addEventListener("click", closeSheet);
  $("notesPath").addEventListener("input", () => { notesPathEdited = true; });

  // Tab 不跑出设置窗口
  $("sheet").addEventListener("keydown", (ev) => {
    if (ev.key !== "Tab") return;
    const nodes = Array.from($("sheet").querySelectorAll("button, select, input, textarea"))
      .filter((n) => !n.disabled && n.offsetParent !== null);
    if (!nodes.length) return;
    const first = nodes[0];
    const last = nodes[nodes.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  });

  $("template").addEventListener("input", schedulePreview);

  // ---------- 记录预览 ----------
  let previewTimer = null;

  function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(updatePreview, 220);
  }

  function presetLabel(fields, template) {
    if ((template || "").trim()) return t("presetCustom");   // 用模板就是自定义
    for (const [name, preset] of Object.entries(PRESETS)) {
      if (FIELD_KEYS.every((k) => !!fields[k] === !!preset[k])) {
        return t("preset" + name.charAt(0).toUpperCase() + name.slice(1));
      }
    }
    return t("presetCustom");
  }

  let previewSeq = 0;

  async function updatePreview() {
    const pre = $("preview");
    const emptyEl = $("previewEmpty");
    const badge = $("presetBadge");
    if (!pre || !emptyEl || !badge) return;

    const fields = readFields();
    const template = $("template").value;
    badge.textContent = presetLabel(fields, template);

    if (!current) {
      pre.hidden = true;
      emptyEl.hidden = false;
      emptyEl.textContent = t("previewEmpty");
      return;
    }
    const seq = ++previewSeq;
    try {
      const resp = await fetch(api("/api/preview"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ word: current.word, fields, template })
      });
      const data = await resp.json();
      if (seq !== previewSeq) return;         // 旧响应别盖住新的
      if (!data.ok) {
        pre.hidden = true;
        emptyEl.hidden = false;
        emptyEl.textContent = t("previewFail", data.error || "");
        return;
      }
      pre.textContent = data.text;
      pre.hidden = false;
      emptyEl.hidden = true;
    } catch (err) {
      if (seq !== previewSeq) return;
      pre.hidden = true;
      emptyEl.hidden = false;
      emptyEl.textContent = t("previewFail", err.message);
    }
  }

  $("lang").addEventListener("change", (ev) => {
    // 切语言会重建复选框，先把还没保存的勾选和模板保住
    const pending = readFields();
    const pendingTpl = $("template").value;
    cfg.lang = ev.target.value;
    LANG = effectiveLang();
    applyI18n();
    $("fields").querySelectorAll("input[type=checkbox]").forEach((cb) => {
      if (Object.prototype.hasOwnProperty.call(pending, cb.dataset.key)) {
        cb.checked = pending[cb.dataset.key];
      }
    });
    $("template").value = pendingTpl;
    schedulePreview();
  });

  document.querySelectorAll(".presets button").forEach((b) => {
    b.addEventListener("click", () => { applyPreset(b.dataset.preset); schedulePreview(); });
  });

  $("saveCfg").addEventListener("click", async () => {
    const body = { fields: readFields(), template: $("template").value, lang: $("lang").value };
    const notesPath = $("notesPath");
    if (!notesPath.disabled && notesPathEdited &&
        (fallbackNotesPath || notesPath.value !== (cfg.notes_path || ""))) {
      body.notes_path = notesPath.value;
    }
    try {
      const resp = await fetch(api("/api/config"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await resp.json();
      if (!data.ok) { toast(data.error || t("cfgFailed", "")); return; }
      if ("notes_path" in body || (cfg.notes_path || "") !== (data.config.notes_path || "")) {
        store(SAVED_KEY, []);
        location.reload();
        return;
      }
      cfg = data.config;
      LANG = effectiveLang();
      applyI18n();
      closeSheet();
      toast(t("cfgSaved"));
    } catch (err) {
      toast(t("cfgFailed", err.message));
    }
  });

  $("openNotes").addEventListener("click", async () => {
    try {
      const resp = await fetch(api("/api/open-notes"), { method: "POST" });
      const data = await resp.json();
      if (!data.ok) toast(t("openFailed", data.error || ""));
    } catch (err) {
      toast(t("openFailed", err.message));
    }
  });

  $("exportAnki").addEventListener("click", () => {
    window.location.href = api("/api/export-anki");
  });

  // 内部比较一律用小写：词典可能返回 London，撤销返回 london，严格比较会错位
  function wkey(word) { return String(word || "").trim().toLowerCase(); }

  // ---------- 快捷键 ----------
  let recentIndex = -1;
  document.addEventListener("keydown", (ev) => {
    const active = document.activeElement;
    const tag = (active && active.tagName) || "";
    const editing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || !!(active && active.isContentEditable);
    const sheetOpen = !$("sheet").hidden;

    if (ev.ctrlKey && (ev.key === "d" || ev.key === "D")) {
      // 查询框里也要能用；只有多行文本框（模板）和设置面板里不抢
      const isTextarea = tag === "TEXTAREA" || !!(active && active.isContentEditable);
      if (sheetOpen || isTextarea) return;
      ev.preventDefault();
      const b = $("save");
      if (b && !b.disabled) b.click();
      return;
    }
    if (ev.key !== "Escape" && (editing || sheetOpen)) return;
    const words = loadStored(RECENT_KEY);
    if (!words.length) return;
    if (ev.key === "ArrowUp" || ev.key === "ArrowDown") {
      ev.preventDefault();
      recentIndex = ev.key === "ArrowDown"
        ? (recentIndex + 1) % words.length
        : (recentIndex - 1 + words.length) % words.length;
      input.value = words[recentIndex];
      doLookup(words[recentIndex]);
    }
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Escape") return;
    if (!$("sheet").hidden) { closeSheet(); return; }   // 设置开着先关设置
    input.value = "";
    input.focus();
  });

  // ---------- 启动 ----------
  async function boot() {
    await loadCfg();
    LANG = effectiveLang();
    applyI18n();
  }

  boot();

  // 存活判据：SSE 长连接 + 心跳
  let watch = null;
  try { watch = new EventSource("/api/watch"); } catch (e) {}

  function heartbeat() {
    fetch(api("/api/heartbeat"), { method: "POST" }).catch(() => {});
  }
  heartbeat();
  setInterval(heartbeat, 20000);

  $("quit").addEventListener("click", async () => {
    if (watch) { try { watch.close(); } catch (e) {} }
    try { await fetch(api("/api/shutdown"), { method: "POST" }); } catch (e) {}
    document.body.innerHTML =
      '<div class="bye"><div class="bye-h">' + t("byeTitle") + "</div>" + t("byeBody") + "</div>";
  });

  form.addEventListener("submit", (ev) => {
    ev.preventDefault();
    doLookup(input.value);
  });
})();
</script>
</body>
</html>
