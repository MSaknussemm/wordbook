name: 功能建议
description: 想要新的记录格式 / 新的快捷键 / 别的词典源
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这个项目的底线是：**零依赖、只跑本机、默认克制**。
        默认界面上不能多出常驻的元素——新功能请藏进设置里，或者做成可选开关。

  - type: textarea
    id: problem
    attributes:
      label: 你现在卡在哪
      description: 描述场景，不要一上来就讲实现
      placeholder: 我读论文时经常一个词记好几遍，想按来源分文件。
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望它怎么用
      description: 从用户视角描述，越具体越好
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过别的办法吗
      description: 比如用哪个现成工具、为什么不够用

  - type: dropdown
    id: scope
    attributes:
      label: 你觉得这算哪一档
      options:
        - 改几行就行
        - 需要新增界面
        - 不确定
    validations:
      required: true
