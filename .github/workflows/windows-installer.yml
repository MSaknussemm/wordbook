name: Windows installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/windows-installer.yml'
      - 'windows_launcher.py'
      - 'wordbook.py'
      - 'index.html'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3
      - name: Build installer
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          $compiler = Join-Path $env:RUNNER_TEMP 'inno'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe' -OutFile $setup
          if ((Get-FileHash $setup).Hash -ne '8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0') {
            throw "Inno Setup download did not match its pinned SHA-256."
          }
          $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', ('/DIR="' + $compiler + '"') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed." }
          ./packaging/build.ps1 -Iscc (Join-Path $compiler 'ISCC.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: Wordbook-Setup-x64
          path: build/installer/Wordbook-Setup-x64.exe
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Wordbook-Setup-x64
      - name: Attach installer to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" Wordbook-Setup-x64.exe --verify-tag --draft --generate-notes
